{% extends 'base.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="max-w-xl mx-auto card-bg p-8 rounded-2xl border border-slate-800">
    <h2 class="text-2xl font-bold text-white mb-6">Tambah Siswa Baru</h2>
    
    <form method="POST" class="flex flex-col gap-4">
        {% csrf_token %}
        <div>
            <label class="block text-slate-400 text-sm mb-2">NISN (Nomor Induk Siswa Nasional)</label>
            <input type="text" name="nisn" value="{{ nisn|default:'' }}" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-slate-400 text-sm mb-2">Nama Lengkap</label>
            <input type="text" name="nama" value="{{ nama|default:'' }}" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-slate-400 text-sm mb-2">Kelas</label>
            <input type="text" name="kelas" value="{{ kelas|default:'' }}" required placeholder="Contoh: 10-A" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">No. WhatsApp Orang Tua</label>
            <input type="text" name="no_hp_ortu" value="{{ no_hp_ortu|default:'' }}" placeholder="Contoh: 6281234567890" class="w-full bg-[#0d1527] border border-slate-700/80 rounded-xl py-3 px-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>
        
        <div class="flex gap-4 mt-4">
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition">Simpan & Buat QR Code</button>
            <a href="{% url 'manajemen_siswa' %}" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-center transition">Batal</a>
        </div>
    </form>
</div>

<!-- TOAST NOTIFIKASI DARI DJANGO MESSAGES (misal: NISN sudah terdaftar) -->
{% if messages %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        {% for message in messages %}
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: '{% if message.tags == "success" %}success{% elif message.tags == "error" %}error{% else %}info{% endif %}',
            title: '{{ message|escapejs }}',
            background: '#111827',
            color: '#ffffff',
            showConfirmButton: false,
            timer: 4000,
            timerProgressBar: true,
        });
        {% endfor %}
    });
</script>
{% endif %}
{% endblock %}
