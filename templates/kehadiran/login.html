<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Efek Cahaya Latar Belakang (Glow Effect) -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-blue-600/20 blur-[140px] rounded-full pointer-events-none"></div>

    <div class="w-full max-w-md p-6 z-10">
        <!-- Logo & Nama Instansi -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-900/50">
                <i class="fa-solid fa-shield-halved text-white text-xl"></i>
            </div>
            <span class="font-bold text-xl tracking-wide">testing</span>
        </div>

        <!-- Kotak Kartu Login -->
        <div class="bg-[#111827]/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl relative">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white mb-2">Welcome Back</h1>
                <p class="text-slate-400 text-sm">Login to your account to continue</p>
            </div>

            <!-- Pesan Error jika Gagal Login -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 text-sm text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="/login/" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="text" name="username" required placeholder="Enter your username" class="w-full bg-[#0d1527] border border-slate-700/80 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required placeholder="Enter your password" class="w-full bg-[#0d1527] border border-slate-700/80 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-900/40 transition duration-200 mt-2">
                    Login
                </button>
            </form>
        </div>

        <p class="text-center text-slate-500 text-xs mt-8">&copy; 2026 testing. All rights reserved.</p>
    </div>

</body>
</html>
